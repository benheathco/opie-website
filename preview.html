<style>/* ============================================================
   Opie landing — global styles
   Design tokens live in :root. Everything else is plain CSS
   classes consumed by the section components in src/components.
   ============================================================ */

:root {
  --ink: #2e2a48;        /* serif headlines / primary text */
  --body: #615f71;       /* muted body copy */
  --teal: #13a4b1;       /* accent */
  --teal2: #0c8c99;
  --line: rgba(24, 22, 46, 0.09);
  --soft: #f6f5fa;
  --dark: #08080c;       /* dark section background */

  --serif: 'Newsreader', Georgia, serif;
  --sans: 'Schibsted Grotesk', system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;

  --maxw: 1180px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::selection { background: rgba(17, 163, 176, 0.22); }

a { color: inherit; }

@keyframes opFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* ---------- layout helpers ---------- */
.container { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }
.section { max-width: var(--maxw); margin: 0 auto; padding: 80px 28px; }

.serif { font-family: var(--serif); font-weight: 500; }

/* Section headings */
.head-center { text-align: center; max-width: 680px; margin: 0 auto 48px; }
.head-split {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 40px; margin-bottom: 44px; flex-wrap: wrap;
}
.h2 {
  margin: 0; font-family: var(--serif); font-weight: 500;
  font-size: clamp(28px, 3.6vw, 44px); letter-spacing: -0.01em;
  line-height: 1.08; color: var(--ink);
}
.head-split .h2 { max-width: 440px; }
.sub {
  margin: 16px auto 0; font-size: 16px; color: var(--body);
  line-height: 1.55; max-width: 500px;
}
.head-split .sub { margin: 8px 0 0; max-width: 380px; font-size: 15.5px; line-height: 1.6; }

/* ---------- buttons ---------- */
.btn-teal {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 13px 26px; font-size: 15px; font-weight: 600;
  color: #fff; text-decoration: none; border: none; cursor: pointer;
  font-family: var(--sans);
  background: linear-gradient(180deg, #1ab3be, #0e94a1);
  border-radius: 100px;
  box-shadow: 0 10px 26px -10px rgba(14, 148, 161, 0.7);
  transition: filter 0.15s ease;
}
.btn-teal:hover { filter: brightness(1.06); }
.btn-teal.sm { padding: 9px 18px; font-size: 14px; box-shadow: 0 5px 14px -6px rgba(14, 148, 161, 0.6); }
.chevron { opacity: 0.85; }

/* ---------- placeholders (swap for real product imagery) ---------- */
.ph { display: flex; align-items: center; justify-content: center; border-radius: 12px; }
.ph-light { background: linear-gradient(135deg, #ece9fb 0%, #f5efef 50%, #e6eff7 100%); border: 1px solid var(--line); }
.ph-deep  { background: linear-gradient(135deg, #efedfb 0%, #f6f1f1 50%, #e9f1f8 100%); border: 1px solid var(--line); }
.ph-dark  { background: linear-gradient(135deg, rgba(170, 156, 228, 0.18), rgba(140, 196, 222, 0.12)); border: 1px solid rgba(255, 255, 255, 0.08); }
.ph-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(70, 60, 110, 0.42); }
.ph-dark .ph-label { color: rgba(255, 255, 255, 0.4); }

/* ============================================================
   NAV
   ============================================================ */
.header {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(12px);
  background: rgba(255, 255, 255, 0.78);
  border-bottom: 1px solid var(--line);
}
.nav {
  max-width: var(--maxw); margin: 0 auto; padding: 15px 28px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 8px; }
.logo-ring {
  width: 21px; height: 21px; border-radius: 50%;
  border: 2.5px solid var(--ink);
  display: flex; align-items: center; justify-content: center;
}
.logo-ring.light { border-color: #fff; width: 20px; height: 20px; }
.logo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
.logo-word { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
.nav-links { display: flex; align-items: center; gap: 28px; }
.nav-link { font-size: 14.5px; text-decoration: none; color: var(--ink); transition: color 0.15s ease; }
.nav-link:hover { color: var(--teal); }

/* ============================================================
   HERO
   ============================================================ */
.hero {
  position: relative; overflow: hidden; padding: 84px 28px 0;
  background: linear-gradient(180deg, #fff 0%, #f3f1fb 38%, #eae7f8 70%, #f4f2fa 100%);
}
.hero-glow { position: absolute; top: 130px; width: 50%; height: 420px; filter: blur(10px); pointer-events: none; }
.hero-glow.l { left: -8%; top: 140px; background: radial-gradient(circle, rgba(168, 150, 235, 0.28), transparent 65%); }
.hero-glow.r { right: -8%; top: 120px; background: radial-gradient(circle, rgba(150, 196, 230, 0.26), transparent 65%); }
.hero-inner { position: relative; max-width: var(--maxw); margin: 0 auto; text-align: center; }
.hero-h1 {
  margin: 0 auto; max-width: 760px; font-family: var(--serif); font-weight: 500;
  font-size: clamp(38px, 5.6vw, 66px); line-height: 1.05; letter-spacing: -0.012em;
  color: var(--ink); text-wrap: balance;
}
.hero-sub { margin: 24px auto 0; max-width: 520px; font-size: 16px; line-height: 1.55; color: var(--body); text-wrap: pretty; }
.hero-cta { margin-top: 30px; }
.hero-window {
  margin: 56px auto -120px; max-width: 920px; overflow: hidden;
  border: 1px solid var(--line); border-bottom: none; border-radius: 16px 16px 0 0;
  background: #fff; box-shadow: 0 -2px 0 rgba(255, 255, 255, 0.6), 0 50px 90px -40px rgba(60, 40, 120, 0.32);
}
.window-bar { display: flex; align-items: center; gap: 7px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.win-dot { width: 10px; height: 10px; border-radius: 50%; background: #e4e2ec; }
.win-url { flex: 1; max-width: 300px; margin: 0 auto; height: 22px; border-radius: 6px; background: var(--soft); }
.window-body { height: 300px; background: linear-gradient(180deg, #fcfcfe, #f6f5fa); display: flex; align-items: center; justify-content: center; }
.chat-card { width: 420px; max-width: 80%; border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 18px; box-shadow: 0 12px 30px -16px rgba(60, 40, 120, 0.25); }
.chat-card p { margin: 0 0 14px; font-size: 13.5px; color: var(--body); }
.chat-row { display: flex; gap: 8px; align-items: center; }
.chip { font-size: 11.5px; padding: 5px 10px; border-radius: 7px; background: var(--soft); color: var(--ink); }
.chat-send { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); }

/* ============================================================
   GENERIC CARD GRID (solve, bento, regulatory, security)
   ============================================================ */
.grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.col-2 { grid-column: span 2; }
.col-3 { grid-column: span 3; }

.solve { padding-top: 170px; }
.card {
  border: 1px solid var(--line); border-radius: 18px; background: #fff;
  overflow: hidden; height: 100%; display: flex; flex-direction: column;
  box-shadow: 0 1px 2px rgba(24, 22, 46, 0.03);
}
.card-head { padding: 26px 26px 0; }
.card-title { margin: 0 0 8px; font-family: var(--serif); font-weight: 500; font-size: 21px; letter-spacing: -0.005em; color: var(--ink); }
.card-desc { margin: 0; font-size: 14px; line-height: 1.5; color: var(--body); }
.card-media { margin: 22px 26px 26px; flex: 1; min-height: 160px; }

/* ============================================================
   DARK SECTION (one interface + stats, final cta, footer)
   ============================================================ */
.dark { position: relative; overflow: hidden; background: var(--dark); color: #f2f2f5; }
.dark .sub { color: rgba(255, 255, 255, 0.56); }
.dark-glow { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); width: 760px; height: 360px; background: radial-gradient(circle, rgba(19, 164, 177, 0.22), transparent 64%); filter: blur(20px); pointer-events: none; }
.dark-inner { position: relative; max-width: var(--maxw); margin: 0 auto; padding: 90px 28px; }
.dark .h2 { color: #fff; }

.bento-card { border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; background: rgba(255, 255, 255, 0.03); padding: 22px; height: 100%; display: flex; flex-direction: column; }
.bento-media { flex: 1; min-height: 150px; margin-bottom: 18px; }
.bento-title { margin: 0; font-size: 15px; line-height: 1.45; font-weight: 500; color: #f2f2f5; }

.stats-wrap { margin-top: 80px; text-align: center; }
.stats-title { margin: 0 0 44px; font-family: var(--serif); font-weight: 500; font-size: clamp(24px, 2.8vw, 34px); letter-spacing: -0.01em; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; border-top: 1px solid rgba(255, 255, 255, 0.12); border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
.stat { padding: 34px 18px; text-align: center; }
.stat-value { font-family: var(--serif); font-size: clamp(34px, 4vw, 50px); font-weight: 500; letter-spacing: -0.02em; line-height: 1; color: #fff; }
.stat-label { margin: 16px auto 0; max-width: 200px; font-size: 13.5px; line-height: 1.5; color: rgba(255, 255, 255, 0.52); }

/* ============================================================
   DEEP DIVE SECTIONS
   ============================================================ */
.dd-hero { border-radius: 18px; aspect-ratio: 24 / 9; margin-bottom: 40px; box-shadow: 0 1px 3px rgba(24, 22, 46, 0.04); }
.dd-points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.point { border-top: 1px solid var(--line); padding: 22px 4px 0; }
.point-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--soft); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
.point-icon span { width: 10px; height: 10px; border-radius: 3px; background: var(--teal); display: block; }
.point-h { margin: 0 0 8px; font-size: 16px; font-weight: 600; letter-spacing: -0.005em; color: var(--ink); }
.point-t { margin: 0; font-size: 14px; line-height: 1.55; color: var(--body); }

/* ============================================================
   CUSTOM AGENTS
   ============================================================ */
.agents { max-width: var(--maxw); margin: 60px auto; padding: 0 28px; }
.agents-card { position: relative; overflow: hidden; border-radius: 24px; background: var(--dark); color: #f2f2f5; display: grid; grid-template-columns: 1fr 1fr; }
.agents-glow { position: absolute; bottom: -80px; left: -40px; width: 420px; height: 300px; background: radial-gradient(circle, rgba(19, 164, 177, 0.26), transparent 64%); filter: blur(16px); pointer-events: none; }
.agents-text { position: relative; padding: 56px 48px; display: flex; flex-direction: column; justify-content: center; }
.eyebrow { font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal); margin-bottom: 16px; }
.agents-text h2 { margin: 0 0 18px; font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 3vw, 38px); letter-spacing: -0.01em; line-height: 1.12; }
.agents-text p { margin: 0 0 28px; font-size: 15.5px; line-height: 1.6; color: rgba(255, 255, 255, 0.56); }
.agents-text .btn-teal { align-self: flex-start; padding: 12px 24px; }
.agents-media { position: relative; padding: 28px; display: flex; }
.agents-media .ph { flex: 1; min-height: 320px; }

/* ============================================================
   REGULATORY
   ============================================================ */
.reg-card { border: 1px solid var(--line); border-radius: 18px; background: #fff; overflow: hidden; box-shadow: 0 1px 2px rgba(24, 22, 46, 0.03); }
.reg-media { height: 180px; border-bottom: 1px solid var(--line); border-radius: 0; }
.reg-body { padding: 26px 28px; }
.reg-body h3 { margin: 0 0 9px; font-family: var(--serif); font-weight: 500; font-size: 20px; letter-spacing: -0.005em; color: var(--ink); }
.reg-body p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--body); }

/* ============================================================
   TEAMS (interactive)
   ============================================================ */
.teams-switch { width: fit-content; margin: 0 auto; }
.teams-tabs { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.team-tab { position: relative; font-family: var(--sans); font-size: 18px; font-weight: 500; cursor: pointer; background: none; border: none; text-align: left; padding: 7px 4px 7px 28px; color: #a7a5b4; transition: color 0.15s ease; }
.team-arrow { position: absolute; left: 0; top: 50%; transform: translateY(-50%); opacity: 0; color: var(--ink); transition: opacity 0.15s ease; }
.team-tab.active { font-family: var(--serif); color: var(--ink); }
.team-tab.active .team-arrow { opacity: 1; }
.team-desc { margin: 26px 0 0; max-width: 360px; text-align: left; font-size: 15.5px; line-height: 1.6; color: var(--ink); }

/* ============================================================
   SECURITY
   ============================================================ */
.sec-card { border: 1px solid var(--line); border-radius: 18px; background: #fff; padding: 30px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(24, 22, 46, 0.03); }
.sec-media { aspect-ratio: 16 / 9; margin-bottom: 22px; }
.sec-card h3 { margin: 0 0 9px; font-family: var(--serif); font-weight: 500; font-size: 21px; letter-spacing: -0.005em; color: var(--ink); }
.sec-card p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--body); }

/* ============================================================
   FINAL CTA
   ============================================================ */
.cta-inner { position: relative; max-width: var(--maxw); margin: 0 auto; padding: 90px 28px 0; text-align: center; }
.cta-inner .h2 { margin: 0 auto; max-width: 560px; font-size: clamp(30px, 4.2vw, 52px); letter-spacing: -0.015em; line-height: 1.06; }
.cta-window { margin: 56px auto -1px; max-width: 900px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.12); border-bottom: none; border-radius: 14px 14px 0 0; background: #fff; box-shadow: 0 -40px 90px -50px rgba(19, 164, 177, 0.5); }
.cta-window .ph { height: 340px; border-radius: 0; }

/* ============================================================
   FOOTER
   ============================================================ */
.footer { background: var(--dark); color: #f2f2f5; border-top: 1px solid rgba(255, 255, 255, 0.08); }
.footer-inner { max-width: var(--maxw); margin: 0 auto; padding: 40px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 24px; }
.footer-links { display: flex; gap: 26px; }
.footer-links a { font-size: 14px; color: rgba(255, 255, 255, 0.6); text-decoration: none; transition: color 0.15s ease; }
.footer-links a:hover { color: #fff; }
.footer-credit { font-size: 13px; color: rgba(255, 255, 255, 0.3); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  .agents-card { grid-template-columns: 1fr; }
  .grid6 .col-2, .grid6 .col-3 { grid-column: span 3; }
  .dd-points { grid-template-columns: 1fr 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 620px) {
  .grid6, .grid2, .dd-points { grid-template-columns: 1fr; }
  .grid6 .col-2, .grid6 .col-3 { grid-column: span 1; }
  .nav-links { gap: 16px; }
  .head-split { flex-direction: column; }
}
</style>
